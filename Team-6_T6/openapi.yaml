openapi: 3.0.3
info:
  title: Namogram Posts Service API (Assignment 06)
  description: CS543 Assignment 06 - RFC 7807 Problem Details & Content Negotiation
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local Development Server

paths:
  /posts:
    post:
      summary: Create post with batch validation
      operationId: createPost
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '422':
          $ref: '#/components/responses/ProblemDetails422'

  /posts/{id}:
    get:
      summary: Get post details with content negotiation
      operationId: getPostById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: Accept
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
            application/xml:
              schema:
                type: string
        '304':
          description: Not Modified
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '406':
          $ref: '#/components/responses/ProblemDetails406'

components:
  schemas:
    CreatePostRequest:
      type: object
      required:
        - caption
        - mediaUrl
      properties:
        caption:
          type: string
        mediaUrl:
          type: string

    PostResponse:
      type: object
      properties:
        id:
          type: string
        caption:
          type: string

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string

  responses:
    ProblemDetails400:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails406:
      description: Not Acceptable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails422:
      description: Unprocessable Entity
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'